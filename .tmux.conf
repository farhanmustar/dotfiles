# Standalone tmux config — byobu-compatible
# Provides what byobu's profile/keybindings chain normally sets up,
# then sources .byobu/.tmux.conf for shared custom settings.

# --- Colors (from .byobu/color.tmux) ---
%hidden BYOBU_DARK="#333333"
%hidden BYOBU_LIGHT="#EEEEEE"
%hidden BYOBU_ACCENT="#75507B"
%hidden BYOBU_HIGHLIGHT="#DD4814"

# --- Core settings (from byobu profiles/tmux) ---
set-option -s escape-time 0
set-option -g mode-keys vi
set-option -g xterm-keys on
set-option -g display-panes-time 150
set-option -g display-panes-colour "$BYOBU_ACCENT"
set-option -g display-panes-active-colour "$BYOBU_HIGHLIGHT"
set-option -g clock-mode-colour "$BYOBU_ACCENT"
set-option -g mode-style "bg=$BYOBU_ACCENT,fg=$BYOBU_LIGHT"
set-option -g message-style "bg=$BYOBU_ACCENT,fg=white"
set-option -g pane-active-border-style "bg=$BYOBU_HIGHLIGHT,fg=$BYOBU_HIGHLIGHT"
set-option -g pane-border-style "fg=$BYOBU_ACCENT"
set-option -g status-style "bg=$BYOBU_DARK,fg=$BYOBU_LIGHT"
set-option -g status-interval 5
set-option -g status-left-length 256
set-option -g status-right-length 256
set-option -g default-command "$SHELL"
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@'
set-window-option -g window-status-style "bg=$BYOBU_DARK,fg=$BYOBU_LIGHT"
set-window-option -g window-status-current-style "bg=$BYOBU_DARK,fg=$BYOBU_LIGHT,reverse"
set-window-option -g window-status-activity-style "bg=$BYOBU_DARK,fg=$BYOBU_LIGHT,bold"
set-window-option -g automatic-rename on
set-window-option -g aggressive-resize on
set-window-option -g monitor-activity on

# --- Source shared custom settings from byobu config ---
source-file ~/.byobu/.tmux.conf

# --- Override status bar (byobu-status not available) ---
set-option -g status-left "#{?client_prefix,#[bg=colour11] #[default], } #S "
set-option -g status-right "#[bg=colour02]#(who | grep -v tmux | wc -l)u#[default] #(uptime | sed 's/.*load average/load/' | sed 's/,//g') #[fg=colour250]| #(free -h | awk '/^Mem/{print $3\"/\"$2}') #[fg=colour250]|#[default]  %I:%M %p   %e/%m/%Y "

# --- Override reload to source this file ---
bind-key r source-file ~/.tmux.conf\; display-message "Config Sourced"

# --- Keybindings (from .byobu/keybindings.tmux, inlined since it depends on byobu paths) ---
unbind-key -n C-a
unbind-key -n C-s
unbind-key -n C-q
set-option -g prefix C-q
set-option -g prefix2 C-q
bind-key q send-prefix

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-z resize-pane -Z

bind-key -n M-m new-window -c "#{pane_current_path}" \; rename-window -
bind-key -n M-n new-window -c "#{pane_current_path}" \; rename-window -
bind-key -n M-, previous-window
bind-key -n M-. next-window

unbind p
bind-key p paste-buffer
bind-key Escape copy-mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
bind-key C-v run "tmux send-keys \"$(xclip -o -sel clipboard)\""

# --- Screen-like keys (from byobu tmux-screen-keys.conf) ---
bind-key ^C new-window -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key ^D detach
bind-key * list-clients
bind-key ^N next-window
bind-key " " next-window
bind-key n next-window
bind-key A command-prompt "rename-window %%"
bind-key ^A last-window
bind-key ^P previous-window
bind-key BSpace previous-window

# --- Byobu F-key bindings (inlined from /usr/share/byobu/keybindings/f-keys.tmux) ---
bind-key -n F2 new-window -c "#{pane_current_path}" \; rename-window "-"
bind-key -n C-F2 display-panes \; split-window -h -c "#{pane_current_path}"
bind-key -n S-F2 display-panes \; split-window -v -c "#{pane_current_path}"
bind-key -n C-S-F2 new-session \; rename-window "-"
bind-key -n F3 previous-window
bind-key -n F4 next-window
bind-key -n M-Left previous-window
bind-key -n M-Right next-window
bind-key -n M-Up switch-client -p
bind-key -n M-Down switch-client -n
bind-key -n S-F3 display-panes \; select-pane -t :.-
bind-key -n S-F4 display-panes \; select-pane -t :.+
bind-key -n S-Up display-panes \; select-pane -U
bind-key -n S-Down display-panes \; select-pane -D
bind-key -n S-Left display-panes \; select-pane -L
bind-key -n S-Right display-panes \; select-pane -R
bind-key -n C-F3 display-panes \; swap-pane -s :. -t :.- \; select-pane -t :.-
bind-key -n C-F4 display-panes \; swap-pane -s :. -t :.+ \; select-pane -t :.+
bind-key -n C-S-F3 swap-window -t :-1 -d
bind-key -n C-S-F4 swap-window -t :+1 -d
bind-key -n M-S-Up resize-pane -U
bind-key -n M-S-Down resize-pane -D
bind-key -n M-S-Left resize-pane -L
bind-key -n M-S-Right resize-pane -R
bind-key -n F6 detach
bind-key -n C-F6 kill-pane
bind-key -n F7 copy-mode
bind-key -n F8 command-prompt -p "(rename-window) " "rename-window '%%'"
bind-key -n C-F8 command-prompt -p "(rename-session) " "rename-session '%%'"
bind-key -n S-F8 next-layout
bind-key -n M-F11 break-pane
bind-key -n S-F11 resize-pane -Z
bind-key -n M-NPage copy-mode \; send-keys NPage
bind-key -n M-PPage copy-mode \; send-keys PPage
